<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090f">
  <title>Eman Live</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <header class="topbar">
    <button class="brand" data-action="home">
      <span class="brand-dot">●</span>
      <span>Eman Live</span>
    </button>

    <button class="coin-button" data-action="wallet">
      🪙 <span id="headerCoins">0</span>
    </button>
  </header>

  <!-- MAIN SCREEN -->
  <main id="screen"></main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button data-action="home" class="nav-button" id="navHome">
      <span>⌂</span>
      <small>Home</small>
    </button>

    <button data-action="live" class="nav-button" id="navLive">
      <span>●</span>
      <small>Live</small>
    </button>

    <button data-action="chat" class="nav-button" id="navChat">
      <span>💬</span>
      <small>Chat</small>
    </button>

    <button data-action="me" class="nav-button" id="navMe">
      <span>☺</span>
      <small>Me</small>
    </button>

  </nav>

</div>

<!-- TOAST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
</body>
</html>
