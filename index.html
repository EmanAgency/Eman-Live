<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Eman Live</title>

  <meta
    name="theme-color"
    content="#111111"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <!-- HEADER -->
  <header class="app-header">

    <div class="brand">
      <div class="brand-logo">E</div>

      <div>
        <strong>Eman Live</strong>
        <span>Live • Connect • Earn</span>
      </div>
    </div>

    <button
      class="coin-display"
      data-action="wallet"
      type="button"
    >
      🪙
      <span id="headerCoins">0</span>
    </button>

  </header>


  <!-- MAIN APP -->
  <main id="screen"></main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button
      id="navHome"
      class="nav-button active"
      data-action="home"
      type="button"
    >
      <span>🏠</span>
      <small>Home</small>
    </button>

    <button
      id="navLive"
      class="nav-button"
      data-action="live"
      type="button"
    >
      <span>🔴</span>
      <small>Live</small>
    </button>

    <button
      id="navChat"
      class="nav-button"
      data-action="chat"
      type="button"
    >
      <span>💬</span>
      <small>Chat</small>
    </button>

    <button
      id="navMe"
      class="nav-button"
      data-action="me"
      type="button"
    >
      <span>👤</span>
      <small>Me</small>
    </button>

  </nav>


  <!-- TOAST -->
  <div
    id="toast"
    class="toast"
  ></div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- EMAN LIVE APP -->
  <script src="js/app.js"></script>

</body>
</html>
